name: Release

# Build the edison-stdiod daemon as a universal macOS binary and publish it.
#
# Two ways to trigger:
#   * Push a tag matching v*       -> builds + attaches assets to a GitHub Release.
#   * Run manually (workflow_dispatch) -> builds + uploads a workflow artifact you
#     can download from the run page to inspect, without publishing a Release.
#
# The published binary is intentionally UNSIGNED (ad-hoc). When consumed by the
# desktop app it is re-signed and notarized as part of the app bundle, so a
# Developer ID signature here would just be overwritten. Integrity for the
# desktop build is provided by SHA256SUMS, which the consumer verifies.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Don't cancel an in-progress release mid-upload; just serialize per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: edison-stdiod
  ASSET_NAME: edison-stdiod-macos-universal

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the stable channel; add both Apple targets so
      # we can lipo them into a single universal Mach-O.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build aarch64-apple-darwin
        run: cargo build --release --bin "$BIN_NAME" --target aarch64-apple-darwin

      - name: Build x86_64-apple-darwin
        run: cargo build --release --bin "$BIN_NAME" --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            "target/aarch64-apple-darwin/release/$BIN_NAME" \
            "target/x86_64-apple-darwin/release/$BIN_NAME" \
            -output "dist/$ASSET_NAME"
          chmod +x "dist/$ASSET_NAME"

      - name: Verify architectures
        run: |
          lipo -info "dist/$ASSET_NAME"
          file "dist/$ASSET_NAME"
          "dist/$ASSET_NAME" --version || true

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 "$ASSET_NAME" > SHA256SUMS

      # Always available: download from the run's Artifacts section to inspect a
      # build without publishing a Release (e.g. manual workflow_dispatch runs).
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/SHA256SUMS
          if-no-files-found: error

      # Only on a v* tag: publish (or update) the matching GitHub Release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ env.ASSET_NAME }}
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

  linux:
    name: Linux static musl (x64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both musl targets; built fully STATIC so the published binary has zero
      # glibc/libc dependency and runs on any distro (incl. Alpine / containers).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # zig + cargo-zigbuild supply a C cross-toolchain for `ring`'s C-crypto,
      # which can't be cross-built to musl with the stock toolchain. Mirrors the
      # desktop repo's scripts/build-stdiod-linux.sh.
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build static musl (both arches)
        run: |
          set -euo pipefail
          mkdir -p dist
          for spec in "x64:x86_64-unknown-linux-musl" "arm64:aarch64-unknown-linux-musl"; do
            arch="${spec%%:*}"; target="${spec##*:}"
            echo "Building $target ..."
            cargo zigbuild --release --bin "$BIN_NAME" --target "$target"
            cp "target/$target/release/$BIN_NAME" "dist/edison-stdiod-linux-$arch"
            chmod +x "dist/edison-stdiod-linux-$arch"
          done
          file dist/edison-stdiod-linux-*
          # x64 binary is native to this runner - smoke-test it.
          ./dist/edison-stdiod-linux-x64 --version || true

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 edison-stdiod-linux-x64 edison-stdiod-linux-arm64 > SHA256SUMS-linux

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: edison-stdiod-linux
          path: |
            dist/edison-stdiod-linux-x64
            dist/edison-stdiod-linux-arm64
            dist/SHA256SUMS-linux
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/edison-stdiod-linux-x64
            dist/edison-stdiod-linux-arm64
            dist/SHA256SUMS-linux
          fail_on_unmatched_files: true
          generate_release_notes: true
