<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="On the user's laptop, a local AI client reaches the remote Edison backend gateway, which drives the local stdiod daemon back down over one outbound WebSocket tunnel; the daemon supervises local stdio MCP servers. The AI client may also call a remote LLM API.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C3FFFD"/>
    </marker>
    <marker id="arrow-start" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3 L7,6 Z" fill="#C3FFFD"/>
    </marker>
    <marker id="arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9BA4A6"/>
    </marker>
    <marker id="arrow-grey-start" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3 L7,6 Z" fill="#9BA4A6"/>
    </marker>
  </defs>

  <!-- Void Black background -->
  <rect width="1020" height="480" fill="#000000"/>

  <!-- grid markers: occasional cyan dashes on the invisible grid -->
  <g stroke="#C3FFFD" stroke-width="1.5" opacity="0.45">
    <path d="M305,26 h10 M310,21 v10"/>
    <path d="M660,28 h10 M665,23 v10"/>
    <path d="M945,70 h10 M950,65 v10"/>
    <path d="M58,300 h10 M63,295 v10"/>
    <path d="M885,205 h10 M890,200 v10"/>
  </g>

  <!-- remote LLM API (third-party, external) -->
  <rect x="70" y="92" width="150" height="58" fill="none" stroke="#9BA4A6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="145" y="120" font-size="13" font-weight="600" fill="#C8C8C8" text-anchor="middle">remote LLM API</text>
  <text x="145" y="138" font-size="10" fill="#9BA4A6" text-anchor="middle">third-party · optional</text>

  <!-- Edison backend gateway (Hackbox: tag top-left) -->
  <rect x="360" y="72" width="205" height="86" fill="none" stroke="#C3FFFD" stroke-width="2"/>
  <rect x="360" y="72" width="82" height="9" fill="#C3FFFD"/>
  <text x="462" y="110" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Edison backend</text>
  <text x="462" y="129" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">gateway</text>
  <text x="462" y="147" font-size="11" fill="#9BA4A6" text-anchor="middle">source of truth</text>

  <!-- ============================ USER'S MACHINE (laptop) ============================ -->
  <!-- screen (rounded, filled surface — deliberately unlike the square wireframe boxes) -->
  <rect x="118" y="248" width="774" height="152" rx="16" fill="#121519" stroke="#9BA4A6" stroke-width="1.8"/>
  <circle cx="505" cy="262" r="2.2" fill="#5E6575"/>
  <!-- base / deck -->
  <polygon points="118,400 892,400 912,424 98,424" fill="#121519" stroke="#9BA4A6" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M483,424 h44" stroke="#5E6575" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="142" y="282" font-size="12" font-weight="600" letter-spacing="2" fill="#9BA4A6">USER'S MACHINE</text>

  <!-- AI client (Hackbox: tag top-left) -->
  <rect x="152" y="296" width="170" height="92" fill="none" stroke="#C3FFFD" stroke-width="2"/>
  <rect x="152" y="296" width="68" height="9" fill="#C3FFFD"/>
  <text x="237" y="346" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI client</text>
  <text x="237" y="364" font-size="11" fill="#9BA4A6" text-anchor="middle">local agent</text>

  <!-- stdiod daemon (Hackbox: tag top-left) -->
  <rect x="420" y="296" width="170" height="92" fill="none" stroke="#C3FFFD" stroke-width="2"/>
  <rect x="420" y="296" width="68" height="9" fill="#C3FFFD"/>
  <text x="505" y="337" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">stdiod</text>
  <text x="505" y="355" font-size="12" fill="#9BA4A6" text-anchor="middle">daemon + CLI</text>
  <text x="505" y="372" font-size="11" fill="#9BA4A6" text-anchor="middle">supervises children</text>

  <!-- local MCP servers (Hackbox stack: tag bottom-right) -->
  <rect x="696" y="304" width="162" height="84" fill="none" stroke="#5E6575" stroke-width="1.5"/>
  <rect x="688" y="296" width="170" height="92" fill="none" stroke="#C3FFFD" stroke-width="2"/>
  <rect x="790" y="379" width="68" height="9" fill="#C3FFFD"/>
  <text x="773" y="335" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">local stdio</text>
  <text x="773" y="353" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">MCP servers</text>
  <text x="773" y="371" font-size="11" fill="#9BA4A6" text-anchor="middle">child processes</text>

  <!-- ============================ connections ============================ -->
  <!-- AI client -> remote LLM API (optional, third-party) -->
  <line x1="205" y1="296" x2="165" y2="152" stroke="#9BA4A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-grey)" marker-start="url(#arrow-grey-start)"/>

  <!-- AI client -> Edison gateway (MCP, out to the cloud) -->
  <line x1="262" y1="296" x2="432" y2="160" stroke="#C3FFFD" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <text x="286" y="240" font-size="11" fill="#9BA4A6" text-anchor="middle">MCP</text>

  <!-- Edison gateway -> stdiod (the outbound WebSocket tunnel, back down) -->
  <line x1="478" y1="160" x2="505" y2="294" stroke="#C3FFFD" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <text x="540" y="206" font-size="12" font-weight="600" letter-spacing="1" fill="#FFFFFF">ONE WEBSOCKET TUNNEL</text>
  <text x="540" y="223" font-size="11" fill="#9BA4A6">outbound · TLS 443 · Bearer auth</text>
  <text x="540" y="239" font-size="11" fill="#9BA4A6">no inbound ports — daemon dials out</text>

  <!-- stdiod <-> MCP servers -->
  <line x1="590" y1="342" x2="686" y2="342" stroke="#C3FFFD" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <text x="638" y="332" font-size="11" fill="#9BA4A6" text-anchor="middle">stdio</text>

  <!-- footer note -->
  <text x="510" y="456" font-size="13" fill="#9BA4A6" text-anchor="middle">Processes, files, and credentials stay on the user's device — the daemon only dials out.</text>
</svg>
